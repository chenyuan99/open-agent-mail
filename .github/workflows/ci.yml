name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install application
        run: python -m pip install --disable-pip-version-check -e .

      - name: Compile sources and tests
        run: python -m compileall -q src tests

      - name: Run test suite
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  package:
    name: Build and smoke-test package
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --disable-pip-version-check build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Install and smoke-test wheel
        run: |
          python -m pip install --disable-pip-version-check dist/*.whl
          open-agent-mail send --help

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: open-agent-mail-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
